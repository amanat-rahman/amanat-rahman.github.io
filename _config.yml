# Site settings. Content lives in _data/*.yml; pages in the root; design in assets/css/style.css.
title: Amanat Ur Rahman
description: >-
  Ph.D. student in Industrial Engineering at the University of Cincinnati. Stochastic
  programming, exact decomposition algorithms, and applied operations research across
  healthcare, transportation, and manufacturing.
url: https://amanat-rahman.github.io
baseurl: ""
lang: en
author: Amanat Ur Rahman
keywords: stochastic programming, operations research, operations research scientist, data scientist, appointment scheduling, healthcare operations, integer L-shaped method, Benders decomposition, mixed-integer programming, optimization under uncertainty, industrial engineering

nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Publications & Talks
    url: /publications/
  - title: Teaching
    url: /teaching/
  - title: Awards
    url: /awards/
  - title: CV
    url: /cv/

timezone: UTC
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - .gitattributes
  - .gitignore
  - preview.js
  - LICENSE
