# Newest first is not required; entries are sorted by date. The home page shows the
# most recent few and links to /news/, which lists everything grouped by year.
# text may contain HTML: <em> for titles, <a> for conference links. Use the >- block form
# so colons and quotes in titles need no escaping.

- date: 2026-11-01
  text: >-
    I presented our work, <em>Using stochastic programming to mitigate patient no-shows and
    short-notice cancellations in outpatient clinics through overbooking and walk-ins</em>, at the
    <a href="https://meetings.informs.org/wordpress/sanfrancisco2026/" target="_blank" rel="noopener">2026 INFORMS Annual Meeting</a>
    in San Francisco, CA. This is joint work with my advisor, Tommaso Giovannelli, and with
    Karmel Shehadeh and Jing Shi.
  images:
    - src: /assets/img/news/informs-2026-talk-wide.jpg
      w: 1200
      h: 771
      alt: Amanat Ur Rahman presenting the motivation slide of his outpatient scheduling talk at the 2026 INFORMS Annual Meeting.
    - src: /assets/img/news/informs-2026-talk-close.jpg
      w: 700
      h: 820
      alt: Amanat Ur Rahman speaking during his talk at the 2026 INFORMS Annual Meeting.
  image_caption: 2026 INFORMS Annual Meeting, San Francisco, November 2026.

- date: 2026-10-14
  text: >-
    I presented our work, <em>Two-stage stochastic optimization of outpatient scheduling with
    overbooking and walk-in patients under no-shows and short-notice cancellations</em>, at MMIE
    Coffee Talks, a seminar series in the Department of Mechanical, Materials, and Industrial
    Engineering at the University of Cincinnati. This is joint work with my advisor, Tommaso
    Giovannelli, and with Karmel Shehadeh and Jing Shi.
  image: /assets/img/news/coffee-talk-2026-10.jpg
  image_alt: Amanat Ur Rahman at the lectern beside the title slide of his talk on two-stage stochastic optimization of outpatient scheduling.
  image_caption: MMIE Coffee Talks, University of Cincinnati, October 14, 2026.

- date: 2026-08-20
  text: >-
    I received a Research Travel Grant from the Graduate Student Government at the University
    of Cincinnati to present my work at the 2026 INFORMS Annual Meeting.

- date: 2026-08-15
  text: >-
    I completed my summer internship as a Data Scientist Intern in Network Planning at Atlas
    Air, where I built a stochastic evaluation framework with MILP recourse for cargo network
    planning under operational uncertainty.

- date: 2026-08-05
  text: >-
    My advisor, Tommaso Giovannelli, presented our work, <em>Using stochastic programming to
    mitigate patient no-shows and short-notice cancellations in outpatient clinics through
    overbooking and walk-ins</em>, at
    <a href="https://coral.ise.lehigh.edu/~mopta/" target="_blank" rel="noopener">MOPTA 2026</a>
    (Modeling and Optimization: Theory and Applications) at Lehigh University in Bethlehem, PA.
    This work is co-authored with Karmel Shehadeh and Jing Shi.

- date: 2026-06-01
  text: >-
    I joined Atlas Air as a Data Scientist Intern in Network Planning for the summer, working
    on the evaluation of cargo network plans under operational uncertainty.

- date: 2026-05-20
  text: >-
    My advisor, Tommaso Giovannelli, presented our work, <em>Using stochastic programming to
    mitigate patient no-shows and short-notice cancellations in outpatient clinics through
    overbooking and walk-ins</em>, at the
    <a href="https://www.iise.org/annual" target="_blank" rel="noopener">IISE Annual Conference &amp; Expo 2026</a>
    in Arlington, TX. This work is co-authored with Karmel Shehadeh and Jing Shi.

- date: 2026-04-01
  text: >-
    I served as recitation instructor for ISE 3011, Deterministic Systems Models, an
    undergraduate course at the University of Cincinnati.

- date: 2025-05-15
  text: >-
    I concluded my graduate research assistantship at the P&amp;G Digital Accelerator. The Azure
    Databricks pipelines I built translate SAP planning volumes into production-line recipe
    rates for Personal Care products and reduced annual manual effort by about 550 hours (50%).

- date: 2024-06-20
  text: >-
    Our paper, <em>Enhanced data-driven virtual metrology on chemical mechanical planarization
    process using dual linear Kalman filter</em>, with X. Han and Xiaodong Jia, was published in
    the proceedings of
    <a href="https://event.asme.org/MSEC-2024" target="_blank" rel="noopener">ASME MSEC 2024</a>
    and presented in Knoxville, TN.

- date: 2024-06-01
  text: >-
    I joined the P&amp;G Digital Accelerator at the University of Cincinnati as a Graduate Research
    Assistant, building production planning pipelines on Azure Databricks.

- date: 2024-03-15
  text: >-
    Our article, <em>Artificial intelligence approach to predict supply chain performance:
    Implications for sustainability</em>, with S. M. Ali, G. Kabir, and S. K. Paul, was
    published in <em>Sustainability</em>.

- date: 2023-08-15
  text: >-
    I began my Ph.D. in Industrial and Systems Engineering at the University of Cincinnati.

- date: 2023-08-01
  text: >-
    I completed my M.S. in Industrial Engineering at the University of Louisville.

- date: 2022-11-15
  text: >-
    I won second place among Ph.D. students at the Fall 2022 Graduate Student Research
    Competition in the Department of Industrial Engineering at the University of Louisville.

- date: 2022-10-15
  text: >-
    I presented our work, <em>Impact of institutional variability and correlated multi-level
    factors on post heart transplant survivability</em>, at the 2022 INFORMS Annual Meeting in
    Indianapolis, IN. This is joint work with X. Chen, Monica Gentili, and J. Trivedi.

- date: 2022-09-15
  text: >-
    Our poster, <em>Quantification of contributing factors affecting post heart transplant
    survivability using multitask Cox model</em>, won third place in the poster competition at
    Research!Louisville 2022.

- date: 2021-08-15
  text: >-
    I joined the Logistics and Distribution Institute at the University of Louisville as a
    Graduate Research Assistant.

- date: 2020-09-15
  text: >-
    I completed my M.S. in Industrial and Production Engineering at Bangladesh University of
    Engineering and Technology.

- date: 2018-12-01
  text: >-
    I was promoted to Assistant Professor in the Department of Mechanical and Production
    Engineering at Ahsanullah University of Science and Technology.

- date: 2015-06-01
  text: >-
    I joined Ahsanullah University of Science and Technology as a Lecturer in the Industrial and
    Production Engineering discipline.

- date: 2014-12-15
  text: >-
    I graduated first among 65 students in the B.S. in Industrial and Production Engineering at
    Ahsanullah University of Science and Technology and received the Dean's Award.
