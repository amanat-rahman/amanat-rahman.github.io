bio:
  - >-
    I am a Ph.D. student in Industrial and Systems Engineering (ISE) at the University of
    Cincinnati (UC), advised by <a href="https://sites.google.com/view/tommasogiovannelli">Dr.
    Tommaso Giovannelli</a>. I hold an M.S. in Industrial Engineering from the University
    of Louisville, and earlier an M.S. from Bangladesh University of Engineering and
    Technology and a B.S. from Ahsanullah University of Science and Technology, both in
    Industrial and Production Engineering. Before moving to the United States, I spent six
    years as a full-time faculty member at Ahsanullah University of Science and Technology
    in Dhaka, Bangladesh.
  - >-
    My research develops two-stage stochastic programming models and exact decomposition
    algorithms for systems that commit capacity before demand is known, with outpatient
    appointment scheduling as the principal application. Outside academia, I have built
    decision-support tools in industry settings: a scenario-based evaluation framework for
    cargo network planning at Atlas Air, and production planning pipelines on Azure
    Databricks at the P&amp;G Digital Accelerator.

interests:
  methodology:
    - Two-stage stochastic programming
    - Multi-objective and set-valued optimization
    - Mixed integer linear program
    - Integer L-shaped decomposition methodologies
    - Optimization under uncertainty
    - Monte Carlo simulation
  applications:
    - Healthcare operations management
    - Airline network planning and transportation systems
    - Semiconductor manufacturing process control
    - Supply chain network design
    - Decision analytics

