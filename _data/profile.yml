bio:
  - >-
    Amanat Ur Rahman is a Ph.D. student in Industrial Engineering at the University of
    Cincinnati, advised by <a href="https://sites.google.com/view/tommasogiovannelli">Dr. Tommaso
    Giovannelli</a>. He holds an M.S. in Industrial Engineering from the University of
    Louisville and spent six years on the faculty of Ahsanullah University of Science and
    Technology in Dhaka, teaching the operations research and production systems core of an
    industrial engineering curriculum.
  - >-
    His research develops two-stage stochastic programming models and exact decomposition
    algorithms for systems that commit capacity before demand is known, with outpatient
    appointment scheduling as the principal application. The same methods carry into practice:
    a stochastic evaluation framework for air cargo network planning at Atlas Air, production
    planning pipelines at the P&amp;G Digital Accelerator, and predictive models for
    semiconductor process control.

interests:
  methodology:
    - Two-stage and multi-stage stochastic programming
    - Integer L-shaped and Benders decomposition
    - Multi-objective and set-valued optimization
    - Mixed-integer linear programming
    - Optimization under uncertainty
  applications:
    - Healthcare operations and appointment scheduling
    - Airline network planning and transportation systems
    - Semiconductor manufacturing process control
    - Supply chain analytics

