bio:
  - >-
    I am a Ph.D. candidate in Industrial and Systems Engineering (ISE) at the University of
    Cincinnati (UC), advised by <a href="https://sites.google.com/view/tommasogiovannelli">Dr.
    Tommaso Giovannelli</a>. I hold an M.S. in Industrial Engineering from the University
    of Louisville, and earlier an M.S. from Bangladesh University of Engineering and
    Technology and a B.S. from Ahsanullah University of Science and Technology, both in
    Industrial and Production Engineering. Before moving to the U.S., I spent six
    years as a full-time faculty member at Ahsanullah University of Science and Technology
    in Dhaka, Bangladesh.
  - >-
    My research develops two-stage stochastic programming models and exact decomposition algorithms for systems that make operational decisions before demand is known, with outpatient appointment scheduling as the principal application. I have also worked in industry. As a Data Scientist Intern in Network Planning at Atlas Air, I built a stochastic evaluation framework with MILP recourse for cargo network planning under operational uncertainty. At the P&G Digital Accelerator at the University of Cincinnati, I built Azure Databricks pipelines that translate SAP planning volumes into production-line recipe rates, cutting about 550 hours of manual work a year.

interests:
  focus: Data-driven decision making under uncertainty.
  methodology:
    - Stochastic optimization
    - Two-stage stochastic programming
    - Decomposition algorithms
    - Mixed-integer linear programming
    - Multi-objective and set-valued optimization
    - Machine learning and AI for prediction
    - Business analytics
  applications:
    - Healthcare operations management
    - Airline network planning and transportation systems
    - Semiconductor manufacturing process control
    - Supply chain network design
    - Decision analytics

