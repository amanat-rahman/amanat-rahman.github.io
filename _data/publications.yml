- id: rahman2026outpatient
  type: working
  title: Using stochastic programming to mitigate patient no-shows and short-notice cancellations in outpatient clinics through overbooking and walk-ins
  authors: A. U. Rahman, T. Giovannelli, K. S. Shehadeh, and J. Shi
  venue: In final co-author review prior to submission
  year: "2026"
  sort: "202610"
  status: Under review
  abstract: >-
    A two-stage stochastic program with an integer first stage that jointly determines
    overbooking levels and appointment slot assignments under uncertain no-shows,
    short-notice cancellations, and walk-in arrivals. The recourse problem is itself a
    mixed-integer program; the model is solved by an enhanced integer L-shaped
    decomposition embedded in a single-tree branch-and-cut framework.

- id: rahman2026pao
  type: working
  title: "Allocating open-access appointment slots in a single-provider session: A two-stage stochastic multi-objective program with an integer first stage"
  authors: A. U. Rahman and T. Giovannelli
  venue: Manuscript in preparation
  year: "2026"
  sort: "202609"
  status: In preparation
  abstract: >-
    A multi-objective extension of the outpatient scheduling problem cast within a
    stochastic set-optimization framework, characterizing the set of efficient
    open-access allocations across patient waiting time, session completion time, and
    unmet same-day demand.

