- id: rahman2026outpatient
  type: working
  title: Two-stage stochastic optimization of outpatient scheduling with overbooking and walk-in patients under no-shows and short-notice cancellations
  authors: A. U. Rahman, T. Giovannelli, K. S. Shehadeh, and J. Shi
  venue: To be submitted to Manufacturing & Service Operations Management
  year: "2026"
  sort: "202610"
  abstract: >-
    Outpatient clinics face significant operational challenges when scheduling appointments
    under uncertainty in the arrival times of scheduled and walk-in patients, service durations,
    no-shows, and short-notice cancellations. Our study proposes a two-stage stochastic
    programming model to mitigate these issues by jointly determining overbooking strategies for
    scheduled patients and open-access slots for walk-in patients in a multi-provider clinic. The
    first stage assigns scheduled patients to providers and appointment slots, and determines
    which slots to overbook or designate as open-access. In the second stage, after the
    uncertainty is realized, the model determines walk-in admission decisions. The objective is
    to minimize the expected cost of patient waiting time, provider idle time and overtime, and
    walk-in denial. To solve this stochastic mixed-integer program, we develop an enhanced integer
    L-shaped decomposition (EILSD) algorithm, implemented as a single-tree branch-and-cut
    procedure that generates scenario-wise integer L-shaped cuts and no-good feasibility cuts at
    the nodes of the branch-and-bound tree. Extensive computational experiments show that the
    proposed EILSD algorithm solves practical problem instances to optimality within a reasonable
    time. The experiments also highlight the value of overbooking and open access, with open
    access reducing the expected cost by up to 23.4% when the cost of denying admission to a
    walk-in patient is high.

- id: rahman2026pao
  type: working
  title: "Allocating open-access appointment slots in a single-provider session: A two-stage stochastic multi-objective program with an integer first stage"
  authors: A. U. Rahman and T. Giovannelli
  venue: In preparation for submission to Operations Research
  year: "2027"
  sort: "202701"
  status: In preparation
  abstract: >-
    A two-stage stochastic multi-objective program for allocating open-access appointment
    slots in a single-provider session. A binary first stage selects the slots to hold open,
    and a multi-objective linear recourse decides how much same-day demand to serve. The
    work will compute the global Pareto set and the efficient allocations.

