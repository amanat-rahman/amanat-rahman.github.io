intro: >-
  Exact optimization methods for systems that must commit capacity before demand is known,
  and algorithms that make those models solvable at operational scale.

# Scholarly research. Keep rows short: the Outcome line should say what a decision
# maker gets, not how hard the instance was to solve.
research:
  - title: Two-stage stochastic optimization for outpatient clinic scheduling under uncertainty
    status: Ph.D. dissertation, working paper to be submitted to Manufacturing & Service Operations Management
    collaborators: with T. Giovannelli, K. S. Shehadeh, and J. Shi
    period: 2023 to present
    tags: [Stochastic programming, Enhanced integer L-shaped method, Branch-and-cut, Healthcare]
    rows:
      - label: Question
        text: How should a clinic book a session when a sizeable share of patients will not attend as scheduled, some cancel at short notice, and others arrive without an appointment?
      - label: Approach
        text: A two-stage stochastic program with an integer first stage, solved exactly by an enhanced integer L-shaped decomposition inside a branch-and-cut algorithm.
      - label: Outcome
        text: A booking plan that assigns scheduled patients to providers and appointment slots and sets which slots to overbook or hold for walk-in patients. The enhanced integer L-shaped method solves to optimality instances that Gurobi alone leaves unsolved within two hours.

  - title: "Allocating open-access appointment slots in a single-provider session: a two-stage stochastic multi-objective program with an integer first stage"
    status: Ph.D. dissertation, in preparation for submission in 2027
    collaborators: with T. Giovannelli
    period: 2023 to present
    tags: [Multi-objective optimization, Set-valued optimization, Two-stage stochastic programming, Healthcare]
    rows:
      - label: Question
        text: Which slots in a single-provider session should be held open for same-day demand when several criteria compete and no weighting of them is fixed in advance?
      - label: Approach
        text: A binary first stage selects the open-access slots, and a multi-objective linear recourse decides how much same-day demand to serve and in which slots. The first-stage objective is the expectation of the random nondominated set of the recourse, so the problem is set-valued.
      - label: Next steps
        text: The work will reformulate the model over a finite set of scenarios as a deterministic multi-objective mixed-integer program and compute the global Pareto set and the efficient allocations.

  - title: Virtual metrology for chemical mechanical planarization process in semiconductor manufacturing
    status: Published in the ASME MSEC 2024 proceedings
    collaborators: with X. Han and X. Jia
    period: 2023 to 2024
    tags: [State-space filtering, Semiconductor manufacturing, Predictive modeling]
    rows:
      - label: Question
        text: Material removal rate cannot be measured on every wafer, so process drift goes unseen between physical measurements.
      - label: Approach
        text: A dual linear Kalman filter for material removal rate prediction, developed at the Lab for Intelligent Metrology Systems.
      - label: Outcome
        text: The lowest mean squared error (7.98) against multiple linear regression, EWMA, and Bayesian ARX benchmarks.

  - title: Multi-task learning for time-to-event modeling of post-heart-transplant outcomes
    status: Presented at INFORMS 2022 and Research!Louisville 2022
    collaborators: with X. Chen, M. Gentili, and J. Trivedi
    period: 2021 to 2023
    tags: [Time-to-event analysis, Multi-task learning, Proportional hazard model, Health services]
    rows:
      - label: Summary
        text: As an M.S. student at the University of Louisville, I built a multi-task Cox proportional hazards model that treats each transplant center as its own task to quantify the center-level factors affecting one-year post-heart-transplant survival.

  - title: Grey-based neural networks for supply chain performance prediction
    status: Published in Sustainability, 2024
    collaborators: with S. M. Ali, G. Kabir, and S. K. Paul
    period: 2018 to 2020
    tags: [Supply chain, Forecasting, Neural networks, Grey systems theory]
    rows:
      - label: Summary
        text: During my M.S. studies at Bangladesh University of Engineering and Technology, I developed a grey-based neural network model that predicts supply chain performance from key performance indicators.

directions_intro: >-
  I intend to pursue four research directions. Each is a methodological question that I study
  in healthcare operations, air cargo network planning, and manufacturing.

directions:
  - title: Networked capacity with shared resources
    text: When sites share a resource pool, such as providers in a clinic network, aircraft and crew in a cargo network, or production lines across plants, how much service does cross-site routing gain, and at what solve cost? Routing links the recourse subproblems that decomposition normally separates.
  - title: Exact decomposition at operational scale
    text: Which combinations of stronger and aggregated cuts, warm starts from heuristic policies, and parallel scenario evaluation make integer L-shaped methods viable on instances that span a full planning horizon? The goal is techniques that carry to any two-stage program with mixed-integer recourse.
  - title: Efficient sets for multi-criteria decisions
    text: How can the efficient set be computed directly, so that the operating point is chosen after the trade-offs are known rather than fixed by weights in advance? Criteria such as access and equity, which expected-value objectives cannot represent, then appear in the output.
  - title: From model to decision support
    text: How should stochastic parameters be calibrated from operational data, recourse-based policies backtested against realized outcomes, and models built into tools that planners run themselves? My applied work in air cargo network planning and consumer goods manufacturing has shaped this agenda.

# Applied and engineering projects. Short bullets, not paragraphs.
projects:
  - title: Stochastic evaluation framework for air cargo network planning
    org: Atlas Air, Network Planning
    period: Summer 2026
    tags: [Pyomo, HiGHS, Gurobi, Monte Carlo, Azure Databricks]
    bullets:
      - Stochastic evaluation framework with MILP recourse for cargo network planning under operational uncertainty, covering fleet flow, capacity utilization, routing, capacity spill, and cascading delay.
      - Disruption cost quantified through Monte Carlo evaluation of the recourse value function.
      - Stochastic parameters calibrated from operational data on Azure Databricks, with automated validation and end-to-end run provenance.

  - title: Production planning automation for Personal Care manufacturing
    org: P&G Digital Accelerator, University of Cincinnati
    period: 2024 to 2025
    tags: [Azure Databricks, Python, SQL, KNIME, Tableau, SAP]
    bullets:
      - Databricks pipelines translating SAP planning volumes into production-line recipe rates, reducing annual manual effort by about 550 hours (50%).
      - Databricks-to-Tableau integration automated through KNIME, with deployed KPI dashboards.

