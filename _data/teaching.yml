  - name: Ahsanullah University of Science and Technology
    unit: Industrial and Production Engineering discipline, Department of Mechanical and Production Engineering
    location: Dhaka, Bangladesh
    period: 2015 to 2021
    roles:
      - title: Assistant Professor
        period: December 2018 to July 2021
      - title: Lecturer
        period: June 2015 to November 2018
    summary: Full teaching load each semester, with theory sections of approximately 50 students. Taught face-to-face, and online for IPE 3107, IPE 4103, and IPE 4206 during the COVID-19 closure (2020 to 2021).
    groups:
      - heading: Operations research and production systems
        courses:
          - code: IPE 3107
            title: Operations Research
            topics: Linear programming and the simplex method, duality and sensitivity analysis, transportation and assignment models, game theory, integer and dynamic programming, queuing models, Markov chains
          - code: IPE 3205
            title: Production Planning and Control
            topics: Forecasting techniques, purchase and production inventory models, scheduling with Gantt charts, line balancing, plant location and layout, break-even analysis, time and motion study
          - code: IPE 4105
            title: Supply Chain Management
            topics: Sourcing and procurement, distribution strategies, warehouse location and customer allocation, strategic alliances and third-party logistics, the SCOR framework, performance measures
          - code: IPE 4103
            title: Operations and Project Management
            topics: Forecasting, capacity planning, inventory models, aggregate planning, MRP and ERP, just-in-time production, line balancing and scheduling, facility location and layout, CPM and PERT
          - code: IPE 4206
            title: Industrial Simulation Sessional
            lab: true
            topics: Discrete-event simulation modeling, input distribution fitting, verification and validation, output analysis, scenario comparison
      - heading: Quantitative methods and engineering economics
        courses:
          - code: MATH 2207
            title: Numerical Analysis and Statistics
            topics: Root finding, numerical integration and differentiation, curve fitting and interpolation, probability distributions, sampling distributions, confidence intervals, hypothesis testing, regression
          - code: HUM 2107
            title: Engineering Economy
            topics: Time value of money, equivalence, present and annual worth analysis, rate of return, replacement and depreciation analysis, benefit-cost evaluation
      - heading: Design, laboratory, and introductory instruction
        courses:
          - code: IPE 3104
            title: Product Design and Development Sessional
            lab: true
          - code: IPE 2102
            title: Manufacturing Processes Sessional
            lab: true
            manual: true
          - code: IPE 3210
            title: Metal Forming and Sheet Metalworking Sessional
            lab: true
          - code: IPE 1110 / 1210
            title: Machine Shop Practice-I and Practice-II
            lab: true
            manual: true
          - code: ME 1103
            title: Introduction to Mechanical and Industrial Engineering
      - heading: Teaching for other departments
        note: "Topics: management functions and organization, motivation and leadership, forecasting, capacity and production planning, inventory control, work study, and break-even and investment analysis."
        courses:
          - code: ME 403
            title: Production Planning and Control
            audience: Textile Technology
          - code: HUM 303
            title: Industrial Management
            audience: Textile Technology
          - code: HUM 3209
            title: Industrial Management
            audience: Electrical and Electronic Engineering

curriculum:
  - title: Laboratory manuals
    period: 2015 to 2021
    context: Ahsanullah University of Science and Technology
    text: Authored the laboratory manuals for IPE 4206 Industrial Simulation Sessional, IPE 2102 Manufacturing Processes Sessional, IPE 1210 Machine Shop Practice-II, and IPE 1110 Machine Shop Practice-I. All four were adopted as the standing course materials for those laboratories.
  - title: Outcome assessment for accreditation (BAETE)
    period: 2015 to 2021
    context: Ahsanullah University of Science and Technology
    text: For the BAETE accreditation of the Industrial and Production Engineering program, mapped course outcomes to program outcomes and exam and assignment questions to course outcomes, and computed outcome attainment from student results; attended an outcome-based education (OBE) curriculum workshop at AUST.

mentoring:
  - title: Undergraduate thesis supervisor
    period: 2015 to 2021
    context: Ahsanullah University of Science and Technology
    text: Supervised five final-year project and thesis groups from problem formulation through data collection, analysis, and defense; advised on research methodology and technical writing.
